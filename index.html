  <script src="masonry.js"></script>
  <script src="transitions.js"></script>

  <script>
  (function () {

    var EASE      = 'cubic-bezier(0.76,0,0.24,1)';
    var LOGO_H    = 18;

    var intro     = document.getElementById('intro');
    var content   = document.getElementById('page-content');
    var siteTitle = document.querySelector('.site-title');

    if (siteTitle) { siteTitle.style.opacity = '0'; siteTitle.style.transition = 'none'; }

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // ── 1. Place green A SVG centred on screen ────────────────
    var startSize = 100;
    var clone = document.createElement('div');
    clone.innerHTML = '<img src="Assets/Ander A Green.svg" alt="" style="width:100%;height:100%;display:block;">';
    clone.style.cssText = [
      'position:fixed',
      'width:'  + startSize + 'px',
      'height:' + startSize + 'px',
      'left:50%',
      'top:50%',
      'transform:translate(-50%,-50%)',
      'opacity:0',
      'z-index:10000',
      'pointer-events:none'
    ].join(';');
    document.body.appendChild(clone);

    // ── 2. Fade in ────────────────────────────────────────────
    wait(250)
    .then(function () {
      clone.style.transition = 'opacity 0.55s ease';
      clone.style.opacity = '1';
      return wait(950);
    })

    // ── 3. Swoop to header position, shrink to logo size ──────
    .then(function () {
      var titleRect  = siteTitle ? siteTitle.getBoundingClientRect() : null;
      var targetLeft = titleRect ? Math.round(titleRect.left) : 88;
      var targetTop  = titleRect ? Math.round(titleRect.top + (titleRect.height - LOGO_H) / 2) : Math.round((54 - LOGO_H) / 2);

      var cur = clone.getBoundingClientRect();
      clone.style.transform = 'none';
      clone.style.left = Math.round(cur.left) + 'px';
      clone.style.top  = Math.round(cur.top)  + 'px';
      void clone.offsetWidth;

      clone.style.transition = [
        'left 0.65s '   + EASE,
        'top 0.65s '    + EASE,
        'width 0.65s '  + EASE,
        'height 0.65s ' + EASE
      ].join(',');
      clone.style.left   = targetLeft + 'px';
      clone.style.top    = targetTop  + 'px';
      clone.style.width  = LOGO_H + 'px';
      clone.style.height = LOGO_H + 'px';

      return wait(750);
    })

    // ── 4. Reveal page + fade overlay ─────────────────────────
    .then(function () {
      content.classList.add('revealed');
      return wait(300);
    })
    .then(function () {
      intro.style.transition = 'opacity 0.5s ease';
      intro.style.opacity = '0';
      return wait(500);
    })

    // ── 5. Fade in real header logo, remove clone ─────────────
    .then(function () {
      if (siteTitle) { siteTitle.style.transition = 'opacity 0.3s ease'; siteTitle.style.opacity = '1'; }
      return wait(300);
    })
    .then(function () {
      if (intro.parentNode) intro.parentNode.removeChild(intro);
      if (clone.parentNode) clone.parentNode.removeChild(clone);
    });

  }());
  </script>
